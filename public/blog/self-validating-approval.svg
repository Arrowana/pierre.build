<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Self-validating multisig approval</title>
  <desc id="desc">A vote approval transaction first verifies expected account data, then only votes if the chain data matches.</desc>
  <rect width="920" height="420" rx="18" fill="#1e1e2e"/>
  <rect x="24" y="24" width="872" height="372" rx="14" fill="#242438" stroke="#45475a"/>
  <text x="46" y="64" fill="#a6e3a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">self-validating vote approve</text>
  <text x="46" y="96" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">the vote only happens after on-chain account data matches the signed expectation</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="60" y="142" width="162" height="62" rx="9" fill="#313244" stroke="#89b4fa"/>
    <text x="83" y="169" fill="#cdd6f4" font-size="14">verify proposal</text>
    <text x="100" y="190" fill="#9399b2" font-size="12">hash/slice</text>

    <path d="M222 173 H280" stroke="#89b4fa" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="280" y="142" width="188" height="62" rx="9" fill="#313244" stroke="#89b4fa"/>
    <text x="306" y="169" fill="#cdd6f4" font-size="14">verify transaction</text>
    <text x="325" y="190" fill="#9399b2" font-size="12">token transfer</text>

    <path d="M468 173 H526" stroke="#89b4fa" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="526" y="142" width="164" height="62" rx="9" fill="#313244" stroke="#89b4fa"/>
    <text x="552" y="169" fill="#cdd6f4" font-size="14">verify targets</text>
    <text x="562" y="190" fill="#9399b2" font-size="12">A, B, mint, V</text>

    <path d="M690 173 H748" stroke="#89b4fa" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="748" y="142" width="112" height="62" rx="9" fill="#173522" stroke="#a6e3a1"/>
    <text x="773" y="169" fill="#a6e3a1" font-size="14">vote</text>
    <text x="767" y="190" fill="#a6e3a1" font-size="12">approve</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="70" y="258" width="330" height="78" rx="10" fill="#1e1e2e" stroke="#f9e2af"/>
    <text x="94" y="287" fill="#f9e2af" font-size="14">signed expectation</text>
    <text x="94" y="313" fill="#cdd6f4" font-size="13">proposal + transaction + target bytes</text>

    <rect x="520" y="258" width="330" height="78" rx="10" fill="#1e1e2e" stroke="#89dceb"/>
    <text x="544" y="287" fill="#89dceb" font-size="14">live chain data</text>
    <text x="544" y="313" fill="#cdd6f4" font-size="13">must match before approval executes</text>

    <path d="M400 297 H520" stroke="#a6e3a1" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-green)"/>
    <text x="435" y="281" fill="#a6e3a1" font-size="13">compare</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
